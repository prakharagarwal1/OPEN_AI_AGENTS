# Voice Agents Docker Compose
version: "3.8"

services:
  voice-agents:
    build: .
    image: voice-agents:latest
    container_name: voice-agents
    restart: unless-stopped
    ports:
      - "3002:3002"
      - "8082:8082"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3002
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - voice-network
    devices:
      - /dev/snd:/dev/snd

  redis:
    image: redis:7-alpine
    container_name: voice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - voice-network

volumes:
  redis-data:

networks:
  voice-network:
    driver: bridge